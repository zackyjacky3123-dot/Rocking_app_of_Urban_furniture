<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#04050d" />
  <title>Urban Furniture 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛋️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Animated aurora + grid + noise background -->
  <div class="aurora" aria-hidden="true">
    <div class="aurora-blob aurora-1"></div>
    <div class="aurora-blob aurora-2"></div>
    <div class="aurora-blob aurora-3"></div>
    <div class="bg-grid mask-fade-b aurora-layer"></div>
    <div class="noise aurora-layer"></div>
  </div>

  <div class="app">
    <!-- ============ Sidebar ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="side-logo">
        <span class="logo-glow" aria-hidden="true"></span>
        <span class="logo-chip">
          <svg class="icon"><use href="#i-sofa" /></svg>
        </span>
        <span class="side-brand">
          <span class="side-name">Urban Furniture</span>
          <span class="side-sub">ACCOUNTING 2026</span>
        </span>
      </div>

      <nav class="side-nav" id="side-nav">
        <a class="nav-item" href="#/" data-route="/">
          <svg class="icon nav-ico"><use href="#i-dashboard" /></svg>
          <span class="nav-label">Dashboard</span>
          <span class="nav-bar" aria-hidden="true"></span>
        </a>
        <a class="nav-item" href="#/accounts" data-route="/accounts">
          <svg class="icon nav-ico"><use href="#i-landmark" /></svg>
          <span class="nav-label">Accounts</span>
          <span class="nav-bar" aria-hidden="true"></span>
        </a>
        <a class="nav-item" href="#/contacts" data-route="/contacts">
          <svg class="icon nav-ico"><use href="#i-users" /></svg>
          <span class="nav-label">Contacts</span>
          <span class="nav-bar" aria-hidden="true"></span>
        </a>
        <a class="nav-item" href="#/products" data-route="/products">
          <svg class="icon nav-ico"><use href="#i-bag" /></svg>
          <span class="nav-label">Products</span>
          <span class="nav-bar" aria-hidden="true"></span>
        </a>
        <a class="nav-item" href="#/journals" data-route="/journals">
          <svg class="icon nav-ico"><use href="#i-book" /></svg>
          <span class="nav-label">Journals</span>
          <span class="nav-bar" aria-hidden="true"></span>
        </a>
      </nav>

      <div class="side-foot">
        <div class="side-status">
          <span class="ping"><span class="ping-ring"></span><span class="ping-dot"></span></span>
          <span class="nav-label status-text">All systems online</span>
        </div>
        <button class="side-collapse" id="collapse-btn" title="Toggle sidebar">
          <svg class="icon" id="collapse-ico"><use href="#i-chev-left" /></svg>
        </button>
      </div>
    </aside>

    <!-- ============ Main column ============ -->
    <div class="main-col">
      <header class="topbar glass">
        <div class="tb-heading">
          <h1 class="tb-title" id="tb-title">Dashboard</h1>
          <p class="tb-sub">
            <svg class="icon tb-spark"><use href="#i-sparkles" /></svg>
            Urban Furniture Accounting System
          </p>
        </div>
        <div class="tb-actions">
          <button class="cmd-btn" id="palette-btn">
            <svg class="icon"><use href="#i-search" /></svg>
            <span class="cmd-label">Quick actions…</span>
            <kbd>Ctrl K</kbd>
          </button>
          <button class="theme-btn" id="theme-btn" title="Toggle theme">
            <svg class="icon ico-sun" id="theme-ico"><use href="#i-sun" /></svg>
          </button>
          <button class="avatar" id="avatar-btn" title="Home">UF<span class="avatar-dot"></span></button>
        </div>
      </header>

      <main class="view" id="view"></main>
    </div>
  </div>

  <!-- Overlays -->
  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="palette-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <!-- ============ Icon sprite (lucide paths) ============ -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-sofa" viewBox="0 0 24 24"><path d="M20 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v3"/><path d="M2 16a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v2H6v-2a2 2 0 0 0-4 0Z"/><path d="M4 18v2M20 18v2M12 4v5"/></symbol>
    <symbol id="i-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></symbol>
    <symbol id="i-landmark" viewBox="0 0 24 24"><path d="M3 22h18"/><path d="M6 18v-7M10 18v-7M14 18v-7M18 18v-7"/><path d="M12 2l9 5H3l9-5z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-2Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></symbol>
    <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></symbol>
    <symbol id="i-package" viewBox="0 0 24 24"><path d="M16.5 9.4 7.55 4.24"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.29 7 12 12l8.71-5"/><path d="M12 22V12"/></symbol>
    <symbol id="i-trending" viewBox="0 0 24 24"><path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M9.94 15.5 8.5 14.06 2.36 12.48a.5.5 0 0 1 0-.96L8.5 9.94 10.08 3.8a.5.5 0 0 1 .96 0L12.62 9.94l6.14 1.58a.5.5 0 0 1 0 .96L12.62 14.06l-1.72 6.14a.5.5 0 0 1-.96 0z"/><path d="M20 3v4M22 5h-4M4 17v2M5 18H3"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-corner" viewBox="0 0 24 24"><path d="M9 10 4 15l5 5"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></symbol>
    <symbol id="i-command" viewBox="0 0 24 24"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  </svg>

  <script src="app.js"></script>
</body>
</html>
